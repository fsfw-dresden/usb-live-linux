# Prevent systemd killing the user session when a process OOMs and is shot, as in:
# 
# systemd[…]: dbus.service: A process of this unit has been killed by the OOM killer.
# systemd[…]: dbus.service: Failed with result 'oom-kill'.
# systemd[…]: session.slice: A process of this unit has been killed by the OOM killer.
# systemd-logind[…]: Session … logged out. Waiting for processes to exit.
# sddm[…]: Display server stopped.
# 
# see https://github.com/systemd/systemd/issues/25376 for further rage

[Manager]
DefaultOOMPolicy=continue
